// ── HELPERS ────────────────────────────────────────────────────────────────
function buildEmpById(list) {
  const m = {};
  list.forEach(e => { m[e.id] = e; });
  return m;
}
function getDirectReports(managerId, list) {
  return list.filter(e => e.manager_id === managerId);
}
function getDownstreamIds(managerId, list) {
  const direct = list.filter(e => e.manager_id === managerId).map(e => e.id);
  let all = [...direct];
  direct.forEach(id => { all = all.concat(getDownstreamIds(id, list)); });
  return all;
}

// ── FIREBASE HELPERS ───────────────────────────────────────────────────────
async function fbSet(col, id, data) {
  const { doc, setDoc } = window.__fs;
  await setDoc(window.__fs.doc(window.__db, col, id), { ...data, _updatedAt: new Date().toISOString() }, { merge: true });
}
async function fbGet(col, id) {
  const { doc, getDoc } = window.__fs;
  const snap = await getDoc(window.__fs.doc(window.__db, col, id));
  return snap.exists() ? snap.data() : null;
}
function fbListen(col, cb) {
  const { collection, onSnapshot, query } = window.__fs;
  return onSnapshot(window.__fs.collection(window.__db, col), snap => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    cb(data);
  });
}
async function fbDelete(col, id) {
  const { doc, deleteDoc } = window.__fs;
  await deleteDoc(window.__fs.doc(window.__db, col, id));
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({ onLogin, employees }) {
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");

  const go = () => {
    const t = email.trim().toLowerCase();
    if (!t) { setErr("Enter your work email."); return; }
    if (t === ADMIN_EMAIL.toLowerCase()) {
      onLogin({ empId:ADMIN_ID, role:"admin", name:"Aswin K R", email:t });
      return;
    }
    const found = employees.find(e => e.email && e.email.toLowerCase() === t);
    if (found) {
      const role = getDirectReports(found.id, employees).length > 0 ? "manager" : "employee";
      onLogin({ empId:found.id, role, name:found.name, email:t });
      return;
    }
    setErr("Email not recognised. Use your Entri work email or contact Aswin.");
  };

  return (
    <div style={{ minHeight:"100vh", background:C.lightGrey, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ ...S.card, width:"100%", maxWidth:380, padding:32 }}>
        <div style={{ fontSize:10, fontWeight:700, color:C.grey, letterSpacing:"1.2px", textTransform:"uppercase", marginBottom:8 }}>ENTRI SOFTWARE</div>
        <div style={S.h1}>Performance Review</div>
        <div style={{ color:C.grey, fontSize:13, marginTop:3, marginBottom:24 }}>Mid-Year 2025 · Learning & Impact</div>
        <label style={S.lbl}>Work email</label>
        <input style={{ ...S.inp, marginBottom:12 }} placeholder="yourname@entri.me"
          value={email} onChange={e=>{setEmail(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&go()} type="email" autoFocus />
        {err && <div style={S.alert("err")}>{err}</div>}
        <button style={{ ...S.btn("pri"), width:"100%" }} onClick={go}>Sign in →</button>
        <div style={{ fontSize:11, color:"#94a3b8", marginTop:14, textAlign:"center" }}>
          Enter your Entri work email to access your review.
        </div>
      </div>
    </div>
  );
}

// ── SELF APPRAISAL ─────────────────────────────────────────────────────────
function SelfAppraisal({ user, employees, submissions, reviews }) {
  const emp = employees.find(e=>e.id===user.empId);
  const existing = submissions[user.empId] || {};
  const rev = reviews[user.empId] || {};
  const [form, setForm] = useState({
    selfCategory: existing.selfCategory||"",
    selfRating: existing.selfRating||"",
    rationale: existing.rationale||"",
    proofItems: existing.proofItems||["","",""],
    improvements: existing.improvements||"",
  });
  const [submitted, setSubmitted] = useState(!!existing.submitted);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");

  useEffect(()=>{
    const ex = submissions[user.empId]||{};
    setForm({
      selfCategory:ex.selfCategory||"",selfRating:ex.selfRating||"",
      rationale:ex.rationale||"",proofItems:ex.proofItems||["","",""],
      improvements:ex.improvements||"",
    });
    setSubmitted(!!ex.submitted);
  },[submissions,user.empId]);

  const setF = (k,v) => setForm(f=>({...f,[k]:v}));
  const setProof = (i,v) => { const p=[...form.proofItems]; p[i]=v; setForm(f=>({...f,proofItems:p})); };

  const save = async (submit=false) => {
    setSaving(true); setMsg("");
    try {
      await fbSet("submissions", user.empId, { ...form, submitted: submit, empId:user.empId, empName:emp?.name||"", savedAt:new Date().toISOString() });
      if(submit) setSubmitted(true);
      setMsg(submit?"Submitted successfully!":"Draft saved.");
    } catch(e){ setMsg("Save failed: "+e.message); }
    setSaving(false);
    setTimeout(()=>setMsg(""),3000);
  };

  const filledProofs = form.proofItems.filter(p=>p.trim().length>30);
  const ready = form.selfCategory && form.selfRating && form.rationale.trim().length>20 && filledProofs.length>=3;
  const feedbackVisible = rev.feedback && rev.feedback.trim().length>0;

  if (submitted) return (
    <div>
      <div style={S.card}>
        <div style={S.alert("ok")}>✓ Submitted. Sent to your reporting manager ({emp?.manager_name}). You cannot edit after submission.</div>
        <hr style={S.div}/>
        <SubView form={existing} />
      </div>
      {feedbackVisible ? (
        <div style={{ ...S.card, borderLeft:`3px solid ${C.dark}` }}>
          <div style={S.lbl}>Manager Feedback</div>
          <div style={{ fontSize:14, color:C.text, lineHeight:1.75, whiteSpace:"pre-wrap" }}>{rev.feedback}</div>
          <div style={{ fontSize:11, color:"#94a3b8", marginTop:10 }}>
            From {emp?.manager_name} · Rating: <strong>{rev.category}{rev.rating}</strong>
          </div>
        </div>
      ) : (
        <div style={{ ...S.card, background:C.lightGrey, textAlign:"center", padding:"14px 0" }}>
          <div style={{ fontSize:13, color:"#94a3b8" }}>Manager feedback will appear here once your review is submitted.</div>
        </div>
      )}
    </div>
  );

  return (
    <div>
      {!submitted && <div style={S.alert("warn")}>Draft mode — save as you go. Submit before Jun 13.</div>}
      <div style={S.card}>
        <div style={S.h2}>Self Appraisal</div>
        <div style={{ fontSize:12, color:C.grey, marginBottom:14 }}>{emp?.name} · {emp?.designation} · Reports to {emp?.manager_name}</div>
        <hr style={S.div}/>
        <div style={{ ...S.row, marginBottom:14 }}>
          <div style={{ flex:1 }}>
            <label style={S.lbl}>Category claiming</label>
            <select style={S.sel} value={form.selfCategory} onChange={e=>setF("selfCategory",e.target.value)}>
              <option value="">Select…</option>
              {CATS.map(c=><option key={c} value={c}>{c} — {CAT_LABEL[c]}</option>)}
            </select>
          </div>
          <div style={{ flex:1 }}>
            <label style={S.lbl}>Rating within category</label>
            <select style={S.sel} value={form.selfRating} onChange={e=>setF("selfRating",e.target.value)}>
              <option value="">Select…</option>
              {[1,2,3].map(r=><option key={r} value={r}>{RAT_LABEL[r]}</option>)}
            </select>
          </div>
        </div>
        <div style={{ marginBottom:14 }}>
          <label style={S.lbl}>Rationale</label>

        </div>
        <hr style={S.div}/>
        <label style={S.lbl}>Proof of Work — minimum 3, must show outcomes / cost saved / efficiency improved</label>

          ✓ "Placement rate improved from 38% to 61% across 4 batches (Jan–May)" &nbsp;|&nbsp; ✗ "Worked with placement team to improve outcomes"
        </div>
        {form.proofItems.map((item,i)=>(
          <div key={i} style={{ ...S.row, marginBottom:8, alignItems:"center" }}>

            {form.proofItems.length>3 && <button style={{ ...S.btn("ghost"), color:"#ef4444", padding:"4px 8px" }} onClick={()=>{const p=[...form.proofItems];p.splice(i,1);setF("proofItems",p);}}>✕</button>}
          </div>
        ))}

  );
}

// ── MANAGER REVIEW ─────────────────────────────────────────────────────────
function ManagerReview({ user, employees, submissions, reviews, isAdmin }) {
  const directReports = isAdmin ? employees : getDirectReports(user.empId, employees);
  const [sel, setSel] = useState(null);
  const [filter, setFilter] = useState("all");

  const getStatus = id => {
    const r = reviews[id]; const s = submissions[id];
    if (r?.approved) return "approved";
    if (r?.category) return "reviewed";
    if (s?.submitted) return "pending";
    return "waiting";
  };
  const STATUS = { approved:{label:"Approved",col:"#16a34a",bg:"#f0fdf4"}, reviewed:{label:"Rated",col:"#2563eb",bg:"#eff6ff"}, pending:{label:"Awaiting review",col:"#d97706",bg:"#fffbeb"}, waiting:{label:"Not submitted",col:"#94a3b8",bg:"#f8fafc"} };

  const counts = { all:directReports.length, approved:0, reviewed:0, pending:0, waiting:0 };
  directReports.forEach(e=>{ counts[getStatus(e.id)]++; });
  const filtered = filter==="all" ? directReports : directReports.filter(e=>getStatus(e.id)===filter);
  const done = counts.approved + counts.reviewed;

  return (
    <div style={{ display:"flex", gap:14, alignItems:"flex-start" }}>
      <div style={{ width:250, flexShrink:0 }}>
        <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
          <div style={{ padding:"12px 14px", borderBottom:`1px solid ${C.border}` }}>
            <div style={{ fontWeight:600, fontSize:13, marginBottom:8 }}>{isAdmin?"All employees":"Your team"} ({directReports.length})</div>
            <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
              {["all","pending","reviewed","approved","waiting"].map(f=>(
                <button key={f} onClick={()=>setFilter(f)} style={{ ...S.btn(filter===f?"pri":"sec"), ...S.btn("sm"), fontSize:10 }}>
                  {f==="all"?"All":STATUS[f].label} {counts[f]>0?`(${counts[f]})`:""}</button>
              ))}
            </div>
          </div>
          <div style={{ maxHeight:500, overflowY:"auto" }}>
            {filtered.map(emp=>{
              const st=getStatus(emp.id); const rv=reviews[emp.id];
              return (
                <div key={emp.id} onClick={()=>setSel(emp.id)} style={{
                  padding:"10px 14px", cursor:"pointer", borderBottom:`1px solid #f1f5f9`,
                  background:sel===emp.id?"#f0f9ff":"#fff",
                  borderLeft:sel===emp.id?"3px solid "+C.dark:"3px solid transparent",
                }}>
                  <div style={{ fontWeight:600, fontSize:13 }}>{emp.name}</div>
                  <div style={{ fontSize:11, color:C.grey, marginBottom:4 }}>{emp.designation}</div>
                  <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                    <span style={{ fontSize:10, color:STATUS[st].col, background:STATUS[st].bg, padding:"2px 6px", borderRadius:3, fontWeight:700 }}>{STATUS[st].label}</span>
                    {rv?.category && <span style={{ ...S.tag(rv.category), fontSize:10 }}>{rv.category}{rv.rating}</span>}
                  </div>
                </div>
              );
            })}
            {filtered.length===0 && <div style={{ padding:14, color:"#94a3b8", fontSize:13 }}>No members in this filter.</div>}
          </div>
        </div>
        <div style={{ ...S.card, marginTop:8, padding:14 }}>
          <div style={{ fontSize:11, fontWeight:700, color:C.grey, marginBottom:6 }}>Progress</div>
          <div style={{ fontSize:22, fontWeight:700 }}>{done}<span style={{ fontSize:13, color:"#94a3b8" }}>/{directReports.length}</span></div>
          <div style={S.prog}><div style={S.progBar(directReports.length?done/directReports.length*100:0)}/></div>
          <div style={{ fontSize:10, color:"#94a3b8", marginTop:4 }}>Deadline Jun 20</div>
        </div>
      </div>
      <div style={{ flex:1 }}>
        {sel ? <ReviewPanel empId={sel} employees={employees} submissions={submissions} reviews={reviews} user={user} isAdmin={isAdmin}/> :
          <div style={{ ...S.card, textAlign:"center", padding:40, color:"#94a3b8" }}><div style={{ fontSize:20 }}>←</div><div style={{ fontSize:13 }}>Select a team member</div></div>}
      </div>
    </div>
  );
}

function ReviewPanel({ empId, employees, submissions, reviews, user, isAdmin }) {
  const emp = employees.find(e=>e.id===empId);
  const sub = submissions[empId];
  const existing = reviews[empId]||{};
  const [rev, setRev] = useState({ category:existing.category||"", rating:existing.rating||"", notes:existing.notes||"", feedback:existing.feedback||"", approved:existing.approved||false });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");

  useEffect(()=>{
    const ex = reviews[empId]||{};
    setRev({ category:ex.category||"", rating:ex.rating||"", notes:ex.notes||"", feedback:ex.feedback||"", approved:ex.approved||false });
  },[reviews, empId]);

  const setF = (k,v) => setRev(r=>({...r,[k]:v}));
  const readyToApprove = rev.category && rev.rating && rev.notes.trim().length>10 && rev.feedback.trim().length>20;

  const save = async (approve=false) => {
    setSaving(true); setMsg("");
    try {
      await fbSet("reviews", empId, { ...rev, approved: approve, reviewedBy:user.empId, reviewerName:user.name, reviewedAt:new Date().toISOString(), empId, empName:emp?.name||"" });
      setRev(r=>({...r, approved: approve }));
      setMsg(approve?"Approved & locked.":"Draft saved.");
    } catch(e){ setMsg("Save failed: "+e.message); }
    setSaving(false);
    setTimeout(()=>setMsg(""),3000);
  };

  const unlock = async () => {
    await fbSet("reviews", empId, { approved: false });
    setRev(r=>({...r,approved:false}));
  };

  const canEdit = !rev.approved || isAdmin;

  return (
    <div>
      <div style={S.card}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div><div style={S.h2}>{emp?.name}</div><div style={{ fontSize:12, color:C.grey }}>{emp?.designation} · {emp?.id} · RM: {emp?.manager_name}</div></div>
          {rev.approved && <span style={{ background:"#f0fdf4", color:"#16a34a", fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:4 }}>✓ Approved</span>}
        </div>
        {!sub?.submitted && <div style={{ ...S.alert("warn"), marginTop:12 }}>This person hasn't submitted their self-appraisal yet.</div>}
        {sub?.submitted && (<>
          <hr style={S.div}/>
          <div style={{ fontSize:11, fontWeight:700, color:C.grey, textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:10 }}>Self Appraisal</div>
          <div style={S.row}>
            <div><label style={S.lbl}>Claimed</label><span style={S.tag(sub.selfCategory)}>{sub.selfCategory} — {CAT_LABEL[sub.selfCategory]}</span></div>
            <div><label style={S.lbl}>Rating</label><strong>{sub.selfRating}</strong></div>
          </div>
          <div style={{ marginTop:10 }}><label style={S.lbl}>Rationale</label><p style={{ fontSize:13, color:C.text, margin:0 }}>{sub.rationale}</p></div>
          <div style={{ marginTop:10 }}>
            <label style={S.lbl}>Proof of Work</label>
            {(sub.proofItems||[]).filter(p=>p.trim()).map((p,i)=>(
              <div key={i} style={{ fontSize:12, color:C.text, padding:"6px 0", borderBottom:`1px solid #f1f5f9`, display:"flex", gap:8 }}>
                <span style={{ color:"#94a3b8", flexShrink:0 }}>{i+1}.</span><span>{p}</span>
              </div>
            ))}
          </div>
          {sub.improvements && <div style={{ marginTop:10 }}><label style={S.lbl}>Area of improvement</label><p style={{ fontSize:13, color:C.text, margin:0 }}>{sub.improvements}</p></div>}
        </>)}
      </div>

      {sub?.submitted && (
        <div style={S.card}>
          <div style={S.h2}>Your Rating</div>
          {rev.approved && !isAdmin && <div style={{ ...S.alert("info"), marginBottom:12 }}>Approved and locked. Only Aswin can override.</div>}
          <div style={{ ...S.row, marginBottom:14 }}>
            <div style={{ flex:1 }}>
              <label style={S.lbl}>Manager category</label>
              <select style={S.sel} value={rev.category} onChange={e=>setF("category",e.target.value)} disabled={!canEdit}>
                <option value="">Select…</option>
                {CATS.map(c=><option key={c} value={c}>{c} — {CAT_LABEL[c]}</option>)}
              </select>
            </div>
            <div style={{ flex:1 }}>
              <label style={S.lbl}>Rating (1/2/3)</label>
              <select style={S.sel} value={rev.rating} onChange={e=>setF("rating",e.target.value)} disabled={!canEdit}>
                <option value="">Select…</option>
                {[1,2,3].map(r=><option key={r} value={r}>{RAT_LABEL[r]}</option>)}
              </select>
            </div>
          </div>
          {rev.category && sub?.selfCategory && rev.category!==sub.selfCategory && (
            <div style={{ ...S.alert("warn"), fontSize:12 }}>You're rating <strong>{rev.category}</strong> vs claimed <strong>{sub.selfCategory}</strong>. Explain the difference in your notes.</div>
          )}
          <div style={{ marginBottom:14 }}>
            <label style={S.lbl}>Internal notes <span style={{ fontWeight:400, color:"#94a3b8" }}>— not shared with employee</span></label>
            <textarea style={{ ...S.inp, minHeight:70 }} value={rev.notes} onChange={e=>setF("notes",e.target.value)} disabled={!canEdit} placeholder="Rationale for your rating. What proof holds up, what doesn't." />
          </div>
          <div style={{ marginBottom:16 }}>
            <label style={S.lbl}>Feedback to employee <span style={{ fontWeight:400, color:"#94a3b8" }}>— visible to employee immediately on save</span></label>
            <textarea style={{ ...S.inp, minHeight:90 }} value={rev.feedback} onChange={e=>setF("feedback",e.target.value)} disabled={!canEdit}
              placeholder="Direct feedback — what they did well, what to improve, what to focus on next half. Be specific." />
          </div>
          <div style={{ display:"flex", gap:10, alignItems:"center" }}>
            {canEdit && <>
              <button style={S.btn("sec")} onClick={()=>save(false)} disabled={saving}>Save draft</button>
              <button style={{ ...S.btn("pri"), opacity:readyToApprove?1:0.4 }} onClick={()=>readyToApprove&&save(true)} disabled={!readyToApprove||saving}>
                {saving?"Saving…":"Approve & lock →"}
              </button>
            </>}
            {isAdmin && rev.approved && <button style={S.btn("danger")} onClick={unlock}>Override — unlock</button>}
            {msg && <span style={{ fontSize:12, color:msg.includes("fail")?"#dc2626":"#16a34a" }}>{msg}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

// ── TEAM MANAGER (admin add/edit/remove) ───────────────────────────────────
function TeamManager({ employees, setEmployees, submissions, reviews }) {
  const [search, setSearch] = useState("");
  const [editing, setEditing] = useState(null); // null | "new" | emp object
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const blank = { id:"", name:"", designation:"", manager_name:"", manager_id:"", email:"", active:true };
  const [form, setForm] = useState(blank);

  const filtered = employees.filter(e=>
    e.name.toLowerCase().includes(search.toLowerCase()) ||
    e.id.toLowerCase().includes(search.toLowerCase()) ||
    e.email.toLowerCase().includes(search.toLowerCase())
  );

  const startEdit = (emp) => { setForm({...emp}); setEditing(emp.id); };
  const startNew = () => { setForm({...blank}); setEditing("new"); };
  const cancel = () => { setEditing(null); setForm(blank); };

  const saveEmp = async () => {
    if (!form.id.trim()||!form.name.trim()||!form.email.trim()) { setMsg("ID, name and email are required."); return; }
    setSaving(true); setMsg("");
    try {
      await fbSet("employees", form.id, { ...form, active:true });
      // Update local list
      if (editing==="new") {
        setEmployees(prev => [...prev.filter(e=>e.id!==form.id), form]);
      } else {
        setEmployees(prev => prev.map(e=>e.id===form.id?form:e));
      }
      setMsg("Saved."); setEditing(null); setForm(blank);
    } catch(e){ setMsg("Save failed: "+e.message); }
    setSaving(false);
    setTimeout(()=>setMsg(""),3000);
  };

  const removeEmp = async (empId) => {
    if (!window.confirm(`Remove ${employees.find(e=>e.id===empId)?.name}? This cannot be undone.`)) return;
    try {
      await fbSet("employees", empId, { active:false });
      setEmployees(prev=>prev.filter(e=>e.id!==empId));
      setMsg("Removed.");
    } catch(e){ setMsg("Remove failed: "+e.message); }
    setTimeout(()=>setMsg(""),3000);
  };

  return (
    <div>
      {msg && <div style={S.alert(msg.includes("fail")?"err":"ok")}>{msg}</div>}
      <div style={{ display:"flex", gap:10, marginBottom:14, alignItems:"center" }}>
        <input style={{ ...S.inp, flex:1 }} placeholder="Search by name, ID or email…" value={search} onChange={e=>setSearch(e.target.value)} />
        <button style={S.btn("pri")} onClick={startNew}>+ Add employee</button>
      </div>

      {editing && (
        <div style={{ ...S.card, borderLeft:`3px solid ${C.dark}`, marginBottom:14 }}>
          <div style={S.h2}>{editing==="new"?"Add New Employee":"Edit Employee"}</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
            {[["id","Emp ID"],["name","Full Name"],["email","Work Email"],["designation","Designation"],["manager_name","Reporting Manager Name"],["manager_id","Reporting Manager Emp ID"]].map(([k,l])=>(
              <div key={k}>
                <label style={S.lbl}>{l}</label>
                <input style={S.inp} value={form[k]||""} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} disabled={k==="id"&&editing!=="new"} />
              </div>
            ))}
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <button style={S.btn("pri")} onClick={saveEmp} disabled={saving}>{saving?"Saving…":"Save"}</button>
            <button style={S.btn("sec")} onClick={cancel}>Cancel</button>
          </div>
        </div>
      )}

      <div style={{ fontSize:12, color:C.grey, marginBottom:8 }}>{filtered.length} of {employees.length} employees</div>
      {filtered.map(emp=>{
        const sub = submissions[emp.id]; const rev = reviews[emp.id];
        return (
          <div key={emp.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderBottom:`1px solid #f1f5f9` }}>
            <div style={{ flex:1 }}>
              <span style={{ fontWeight:600, fontSize:13 }}>{emp.name}</span>
              <span style={{ color:"#94a3b8", fontSize:11, marginLeft:8 }}>{emp.id}</span>
              <div style={{ fontSize:11, color:C.grey }}>{emp.designation} · {emp.email} · RM: {emp.manager_name}</div>
            </div>
            <div style={{ display:"flex", gap:5 }}>
              {sub?.submitted && <span style={{ background:"#e0f2fe", color:"#0369a1", fontSize:10, fontWeight:700, padding:"2px 6px", borderRadius:3 }}>SUBMITTED</span>}
              {rev?.approved && <span style={{ background:"#f0fdf4", color:"#16a34a", fontSize:10, fontWeight:700, padding:"2px 6px", borderRadius:3 }}>APPROVED</span>}
            </div>
            <button style={{ ...S.btn("sec"), ...S.btn("sm") }} onClick={()=>startEdit(emp)}>Edit</button>
            <button style={{ ...S.btn("danger"), ...S.btn("sm") }} onClick={()=>removeEmp(emp.id)}>Remove</button>
          </div>
        );
      })}
    </div>
  );
}

// ── EXPORT ─────────────────────────────────────────────────────────────────
function ExportPanel({ employees, submissions, reviews }) {
  const [status, setStatus] = useState("");
  const buildRows = () => {
    const h = ["Emp ID","Name","Email","Designation","Reporting Manager","Manager ID","Self Category","Self Rating","Self Rationale","Proof 1","Proof 2","Proof 3","Area of Improvement","Manager Category","Manager Rating","Internal Notes","Feedback to Employee","Approved","Submitted At","Reviewed At"];
    const rows = [h];
    employees.forEach(emp=>{
      const s=submissions[emp.id]||{}; const r=reviews[emp.id]||{}; const p=s.proofItems||[];
      rows.push([emp.id,emp.name,emp.email||"",emp.designation,emp.manager_name,emp.manager_id,
        s.selfCategory||"",s.selfRating||"",s.rationale||"",p[0]||"",p[1]||"",p[2]||"",s.improvements||"",
        r.category||"",r.rating||"",r.notes||"",r.feedback||"",r.approved?"Yes":"No",
        s.savedAt?new Date(s.savedAt).toLocaleString():"",r.reviewedAt?new Date(r.reviewedAt).toLocaleString():""]);
    });
    return rows;
  };
  const csv = () => {
    const rows=buildRows();
    const blob=new Blob(["\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`LI_Review_${new Date().toISOString().slice(0,10)}.csv`;a.click();
    setStatus("CSV downloaded"); setTimeout(()=>setStatus(""),3000);
  };
  const excel = () => {
    const rows=buildRows(); const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:8},{wch:28},{wch:28},{wch:30},{wch:28},{wch:8},{wch:10},{wch:6},{wch:40},{wch:40},{wch:40},{wch:40},{wch:30},{wch:10},{wch:6},{wch:40},{wch:50},{wch:8},{wch:20},{wch:20}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Review Data");
    const catDist={A:0,B:0,C:0,D:0}; Object.values(reviews).forEach(r=>{if(r.category)catDist[r.category]++;});
    const s2=XLSX.utils.aoa_to_sheet([["L&I Mid-Year Review 2025"],[],["Total employees",employees.length],["Submitted",employees.filter(e=>submissions[e.id]?.submitted).length],["Approved",employees.filter(e=>reviews[e.id]?.approved).length],[],["Category A",catDist.A],["Category B",catDist.B],["Category C",catDist.C],["Category D",catDist.D],[],["Exported",new Date().toLocaleString()]]);
    s2["!cols"]=[{wch:30},{wch:15}];
    XLSX.utils.book_append_sheet(wb,s2,"Summary");
    XLSX.writeFile(wb,`LI_Review_${new Date().toISOString().slice(0,10)}.xlsx`);
    setStatus("Excel downloaded"); setTimeout(()=>setStatus(""),3000);
  };
  const sub=employees.filter(e=>submissions[e.id]?.submitted).length;
  const app=employees.filter(e=>reviews[e.id]?.approved).length;
  return (
    <div>
      <div style={S.card}>
        <div style={S.h2}>Export data</div>
        <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
          {[["Total",employees.length,C.dark],["Submitted",sub,"#0284c7"],["Approved",app,"#16a34a"]].map(([l,v,c])=>(
            <div key={l} style={{ background:"#f8fafc", border:`1px solid ${C.border}`, borderRadius:6, padding:"10px 16px", textAlign:"center" }}>
              <div style={{ fontSize:22, fontWeight:700, color:c }}>{v}</div>
              <div style={{ fontSize:11, color:C.grey }}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{ fontSize:13, color:C.grey, marginBottom:14 }}>Includes all self-appraisal data, proof items, manager ratings, internal notes, and employee feedback.</div>
        <div style={{ display:"flex", gap:10, alignItems:"center" }}>
          <button style={S.btn("pri")} onClick={excel}>⬇ Excel (.xlsx)</button>
          <button style={S.btn("sec")} onClick={csv}>⬇ CSV</button>
          {status && <span style={{ fontSize:12, color:"#16a34a" }}>✓ {status}</span>}
        </div>
      </div>
      <div style={S.card}>
        <div style={S.h2}>Import to Google Sheets</div>
        <ol style={{ fontSize:13, color:C.text, lineHeight:1.9, margin:0, paddingLeft:20 }}>
          <li>Download CSV above</li>
          <li>Open <a href="https://sheets.google.com" target="_blank" style={{ color:"#0284c7" }}>Google Sheets</a> → new sheet</li>
          <li>File → Import → Upload → select CSV → Replace current sheet → Import</li>
        </ol>
      </div>
    </div>
  );
}

// ── ROOT APP ───────────────────────────────────────────────────────────────
function App() {
  const [fbReady, setFbReady] = useState(!!window.__firebaseReady);
  const [session, setSession] = useState(null);
  const [employees, setEmployees] = useState(SEED_EMPLOYEES);
  const [submissions, setSubmissions] = useState({});
  const [reviews, setReviews] = useState({});
  const [loading, setLoading] = useState(true);

  // Wait for Firebase
  useEffect(()=>{
    if (window.__firebaseReady) { setFbReady(true); return; }
    const h = ()=>setFbReady(true);
    window.addEventListener('firebaseReady', h);
    return ()=>window.removeEventListener('firebaseReady',h);
  },[]);

  // Live listeners once Firebase ready
  useEffect(()=>{
    if (!fbReady) return;
    const u1 = fbListen("submissions", data=>{ setSubmissions(data); setLoading(false); });
    const u2 = fbListen("reviews", data=>setReviews(data));
    const u3 = fbListen("employees", data=>{
      const overrides = data || {};
      // Merge: start from seed, apply any Firestore overrides, remove inactive
      const merged = SEED_EMPLOYEES
        .map(e => overrides[e.id] ? { ...e, ...overrides[e.id] } : e)
        .filter(e => e.active !== false);
      // Add any new employees added via admin panel not in seed
      Object.values(overrides).forEach(e => {
        if (e.active !== false && !merged.find(m => m.id === e.id)) merged.push(e);
      });
      setEmployees(merged.length > 0 ? merged : SEED_EMPLOYEES);
    });
    return ()=>{ u1(); u2(); u3(); };
  },[fbReady]);

  if (!fbReady) return <Loading msg="Connecting to Firebase…"/>;
  if (loading) return <Loading msg="Loading review data…"/>;
  if (!session) return <Login onLogin={setSession} employees={employees}/>;

  const emp = employees.find(e=>e.id===session.empId);
  const directReports = getDirectReports(session.empId, employees);
  const isManager = directReports.length > 0;
  const isAdmin = session.role==="admin";

  return (
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={S.logo}>Entri · L&I Performance Review</span>
          <span style={{ background:"#f1f5f9", color:C.grey, fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:4, textTransform:"uppercase" }}>
            {isAdmin?"Admin":isManager?"Manager":"Employee"}
          </span>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center" }}>
          <span style={{ fontSize:12, color:C.grey }}>{session.name}</span>
          <button style={{ ...S.btn("ghost"), fontSize:12, color:C.grey }} onClick={()=>setSession(null)}>Sign out</button>
        </div>
      </div>
      <div style={S.wrap}>
        <div style={{ marginBottom:20 }}>
          <div style={S.h1}>{isAdmin?"Admin Dashboard":isManager?"Review Dashboard":"My Appraisal"}</div>
          <div style={{ color:C.grey, fontSize:13 }}>Mid-Year 2025 · Deadline <strong>Jun 30, 2025</strong></div>
        </div>
        {isAdmin ? (
          <AdminPanel employees={employees} setEmployees={setEmployees} submissions={submissions} reviews={reviews}/>
        ) : (
          <div>
            {emp && <div style={{ marginBottom:20 }}><SelfAppraisal user={session} employees={employees} submissions={submissions} reviews={reviews}/></div>}
            {isManager && (
              <div>
                <div style={{ fontWeight:700, fontSize:15, marginBottom:12 }}>Review your team</div>
                <ManagerReview user={session} employees={employees} submissions={submissions} reviews={reviews} isAdmin={false}/>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
